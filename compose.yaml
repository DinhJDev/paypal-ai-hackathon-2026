services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: suitefolk
      POSTGRES_USER: suitefolk
      POSTGRES_PASSWORD: ${SUITEFOLK_DB_PASSWORD:?Database password required}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suitefolk -d suitefolk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: