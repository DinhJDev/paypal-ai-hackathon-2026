spring:
  application:
    name: api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
          jwk-set-uri: ${AUTH0_JWK_SET_URI}
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_1
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**
  show-actuator: false

paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  autopay-enabled: ${PAYPAL_AUTOPAY_ENABLED:false}
  return-url: ${PAYPAL_RETURN_URL:http://localhost:8080/api/v1/rent-schedules/paypal/return}
  cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:3000/rent/paypal/return?status=cancelled}
  web-base-url: ${APP_BASE_URL:http://localhost:3000}
