name: API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}-${{ github.triggering_actor }}
  cancel-in-progress: true

jobs:
  verify:
    name: API build and test
    # Only the owner can start/rerun jobs for events recorded while public.
    if: ${{ github.actor == 'DinhJDev' && github.triggering_actor == 'DinhJDev' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Check Docker for Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify
